# Merchant-owned Shopify app source generated by Tender Prompt.
# Do not commit client secrets or app automation tokens.

client_id = "<shopify-client-id>"
name = "Checkout Contact Blocker"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
scopes = "read_orders,read_validations,write_validations"

[access.admin]
embedded_app_direct_api_access = true
direct_api_mode = "online"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2026-04"

[build]
automatically_update_urls_on_dev = true

[shop.metafields.app.blocked_addresses]
type = "multi_line_text_field"
name = "Blocked checkout addresses"
access.admin = "merchant_read_write"
