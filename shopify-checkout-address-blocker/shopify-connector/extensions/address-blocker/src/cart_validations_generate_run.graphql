query Input {
  cart {
    buyerIdentity {
      email
      phone
    }
    deliveryGroups {
      deliveryAddress {
        address1
        city
        provinceCode
        countryCode
        zip
        phone
      }
    }
    billingAddress {
      address1
      city
      provinceCode
      countryCode
      zip
      phone
    }
  }
  shop {
    blockedAddresses: metafield(namespace: "$app", key: "blocked_addresses") {
      value
    }
  }
}
