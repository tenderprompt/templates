name = "fixed-price-bundle-analytics-pixel"
type = "web_pixel_extension"

runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.endpoint]
name = "Tender analytics endpoint"
description = "Published Tender app endpoint that receives forwarded bundle Customer Events."
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]

[settings.fields.source]
name = "Pixel source"
description = "Low-cardinality source label included in forwarded bundle analytics events."
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]

